<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Entrar · IA 4K de Fotos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23050505%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2738%27 font-family=%27Arial%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%23E2B84C%27%3E4K%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:#0E0D0B; --panel-2:#17150F; --ink:#F5F2EA; --muted:#9A9384; --line:#2A261D;
  --gold:#E2B84C; --gold-deep:#A8811F; --gold-soft:#1F190B; --gold-ink:#130E02; --gold-txt:#F2D27A;
  --alert:#C9343F;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body{min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.topo{padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;letter-spacing:.04em;font-size:14px;text-transform:uppercase}
main{max-width:420px;margin:0 auto;padding:28px 16px 40px}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;margin:4px 0 8px}
h1 mark{background:none;color:var(--gold)}
.sub{color:var(--muted);margin:0 0 22px}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.abas button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer}
.abas button[aria-selected=true]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-txt)}
label{display:block;margin:0 0 6px;font-weight:500;font-size:14px;color:var(--gold-txt)}
input{display:block;width:100%;min-height:52px;margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:12px;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--gold-ink);background:linear-gradient(var(--gold),var(--gold-deep));cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.erro{background:#2a0f12;border:1px solid var(--alert);color:#ffd9dc;border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topo">Odonto 4K · IA</header>
<main>
  <h1>IA 4K de <mark>Fotos</mark></h1>
  <p class="sub">Entre na sua conta para melhorar suas fotos.</p>

  <div class="abas" role="tablist">
    <button type="button" role="tab" id="aba-entrar" aria-selected="true">Entrar</button>
    <button type="button" role="tab" id="aba-criar" aria-selected="false">Criar conta</button>
  </div>

  <div id="erro" class="erro" role="alert" hidden></div>

  <form id="form" novalidate>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn" id="enviar">Entrar</button>
  </form>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var modo = 'entrar';

  fetch('/api/eu').then(function (r) { if (r.ok) location.replace('/'); });

  function trocar(novo) {
    modo = novo;
    $('aba-entrar').setAttribute('aria-selected', novo === 'entrar');
    $('aba-criar').setAttribute('aria-selected', novo === 'criar');
    $('enviar').textContent = novo === 'entrar' ? 'Entrar' : 'Criar minha conta';
    $('senha').autocomplete = novo === 'entrar' ? 'current-password' : 'new-password';
    $('erro').hidden = true;
  }
  $('aba-entrar').addEventListener('click', function () { trocar('entrar'); });
  $('aba-criar').addEventListener('click', function () { trocar('criar'); });

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('erro').hidden = true;
    $('enviar').disabled = true;
    fetch(modo === 'entrar' ? '/api/entrar' : '/api/cadastrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, senha: $('senha').value })
    }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.erro || 'Algo deu errado.'); });
    }).then(function () {
      location.replace('/');
    }).catch(function (e) {
      $('erro').textContent = e.message; $('erro').hidden = false;
      $('enviar').disabled = false;
    });
  });
})();
</script>
</body>
</html>
